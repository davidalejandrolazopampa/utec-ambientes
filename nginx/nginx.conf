worker_processes auto;
events { worker_connections 1024; }
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # No revelar la versión de nginx en cabeceras/errores.
    server_tokens off;
    # Límite de tamaño de las peticiones (evita cuerpos enormes).
    client_max_body_size 10m;

    upstream backend { server backend:8080; }
    upstream frontend { server frontend:5173; }

    server {
        listen 80;
        server_name localhost;

        # Cabeceras de seguridad básicas (en prod, terminar TLS y añadir HSTS).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # API y Swagger → Backend
        location /api/ { proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
        location /swagger-ui/ { proxy_pass http://backend; }
        location /api-docs/ { proxy_pass http://backend; }
        location /actuator/ { proxy_pass http://backend; }

        # Frontend (dev con HMR)
        location / { proxy_pass http://frontend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
    }
}
