<svg width="100%" viewBox="0 0 632 842" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Flujo: reservar un laboratorio</title>
  <desc>Guía para que un estudiante reserve un recurso (con los correos de los participantes) sin errores.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
    text{font-family:"system-ui", -apple-system,"system-ui","Segoe UI",sans-serif}
    .start{fill:#E1F5EE;stroke:#0F6E56}
    .proc{fill:#E6F1FB;stroke:#185FA5}
    .dec{fill:#FDF1E3;stroke:#B5701E}
    .err{fill:#FCEBEB;stroke:#A32D2D}
    .fin{fill:#F1EFE8;stroke:#5F5E5A}
    .tx{font-size:11.5px;fill:#16302b;text-anchor:middle}
    .txp{font-size:11.5px;fill:#0C447C;text-anchor:middle}
    .txd{font-size:11.5px;fill:#7A4A12;text-anchor:middle}
    .txe{font-size:11px;fill:#791F1F;text-anchor:middle}
    .txf{font-size:11.5px;fill:#3D3D3A;text-anchor:middle;font-weight:600}
    .lbl{font-size:11px;fill:#3D3D3A;font-weight:600}
    .edge{stroke:#73726C;stroke-width:1.5;fill:none}
    .loop{stroke:#A32D2D;stroke-width:1.25;fill:none;stroke-dasharray:4 3}
    </style>
  </defs>
  <text x="200" y="20" class="txf" style="font-size:15px">Reservar un laboratorio</text>
  <rect x="104" y="30" width="192" height="34" rx="16" class="start" stroke-width="1"/>
  <text x="200" y="47.0" class="tx" dominant-baseline="central">Inicio (sesión iniciada)</text>
  <rect x="50" y="90" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="106.5" class="txp" dominant-baseline="central">Abre &#x27;Laboratorios&#x27; y filtra por piso /</text>
<text x="200" y="121.5" class="txp" dominant-baseline="central">fase / disponibilidad</text>
  <rect x="50" y="164" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="180.5" class="txp" dominant-baseline="central">Abre el laboratorio y mira la cuadrícula</text>
<text x="200" y="195.5" class="txp" dominant-baseline="central">de recursos</text>
  <polygon points="200,238 358,280 200,322 42,280" class="dec" stroke-width="1"/>
  <text x="200" y="273.0" class="txd" dominant-baseline="central">¿Hay un recurso disponible</text>
<text x="200" y="287.0" class="txd" dominant-baseline="central">(verde)?</text>
  <rect x="50" y="348" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="364.5" class="txp" dominant-baseline="central">Elige recurso, fecha, hora, duración,</text>
<text x="200" y="379.5" class="txp" dominant-baseline="central">participantes y tu carrera</text>
  <rect x="50" y="422" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="438.5" class="txp" dominant-baseline="central">Ingresa el correo de cada participante</text>
<text x="200" y="453.5" class="txp" dominant-baseline="central">(el 1º es el tuyo; los demás, registrados)</text>
  <rect x="50" y="496" width="300" height="42" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="517.0" class="txp" dominant-baseline="central">Pulsa &#x27;Reservar&#x27;</text>
  <polygon points="200,564 358,615 200,666 42,615" class="dec" stroke-width="1"/>
  <text x="200" y="601.0" class="txd" dominant-baseline="central">¿Validación correcta? (fecha</text>
<text x="200" y="615.0" class="txd" dominant-baseline="central">≤1 día, horario, aforo, correos,</text>
<text x="200" y="629.0" class="txd" dominant-baseline="central">sin choques)</text>
  <rect x="50" y="692" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="708.5" class="txp" dominant-baseline="central">Reserva creada (PENDIENTE) + correo</text>
<text x="200" y="723.5" class="txp" dominant-baseline="central">&#x27;recuerda tu check-in&#x27;</text>
  <rect x="54" y="766" width="291" height="34" rx="16" class="fin" stroke-width="1"/>
  <text x="200" y="783.0" class="txf" dominant-baseline="central">Haz check-in (se habilita 10 min antes)</text>
  <line x1="200" y1="64" x2="200" y2="88" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="138" x2="200" y2="162" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="212" x2="200" y2="236" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="322" x2="200" y2="346" class="edge" marker-end="url(#arrow)"/>
  <text x="208" y="339" class="lbl">Sí</text>
  <line x1="200" y1="396" x2="200" y2="420" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="470" x2="200" y2="494" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="538" x2="200" y2="562" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="666" x2="200" y2="690" class="edge" marker-end="url(#arrow)"/>
  <text x="208" y="683" class="lbl">Sí</text>
  <line x1="200" y1="740" x2="200" y2="764" class="edge" marker-end="url(#arrow)"/>
  <rect x="390" y="250" width="185" height="61" rx="9" class="err" stroke-width="1"/>
  <text x="482" y="265.0" class="txe" dominant-baseline="central">Prueba otra hora o lab;</text>
<text x="482" y="280.0" class="txe" dominant-baseline="central">revisa el calendario del</text>
<text x="482" y="295.0" class="txe" dominant-baseline="central">lab</text>
  <line x1="358" y1="280" x2="388" y2="280" class="edge" marker-end="url(#arrow)"/>
  <text x="374" y="274" class="lbl" text-anchor="middle">No</text>
  <path d="M575,280 L600,280 L600,188.0 L352,188.0" class="loop" marker-end="url(#arrow)"/>
  <rect x="390" y="577" width="185" height="76" rx="9" class="err" stroke-width="1"/>
  <text x="482" y="592.5" class="txe" dominant-baseline="central">Corrige según el mensaje:</text>
<text x="482" y="607.5" class="txe" dominant-baseline="central">INVALID_DATE · DATE_TOO_FAR ·</text>
<text x="482" y="622.5" class="txe" dominant-baseline="central">EXCEEDS_CAPACITY · correo no</text>
<text x="482" y="637.5" class="txe" dominant-baseline="central">registrado · ocupado</text>
  <line x1="358" y1="615" x2="388" y2="615" class="edge" marker-end="url(#arrow)"/>
  <text x="374" y="609" class="lbl" text-anchor="middle">No</text>
  <path d="M575,615 L600,615 L600,372.0 L352,372.0" class="loop" marker-end="url(#arrow)"/>
  <text x="50" y="838" style="font-size:10px;fill:#5F5E5A">Verde=inicio · Azul=acción · Ámbar=decisión · Rojo=corrección · Gris=fin</text>
</svg>
