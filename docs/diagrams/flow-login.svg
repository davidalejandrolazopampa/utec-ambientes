<svg width="100%" viewBox="0 0 632 604" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Flujo: iniciar sesión</title>
  <desc>Guía paso a paso para iniciar sesión con Google en UTEC Lab Reservation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
    text{font-family:"system-ui", -apple-system,"system-ui","Segoe UI",sans-serif}
    .start{fill:#E1F5EE;stroke:#0F6E56}
    .proc{fill:#E6F1FB;stroke:#185FA5}
    .dec{fill:#FDF1E3;stroke:#B5701E}
    .err{fill:#FCEBEB;stroke:#A32D2D}
    .fin{fill:#F1EFE8;stroke:#5F5E5A}
    .tx{font-size:11.5px;fill:#16302b;text-anchor:middle}
    .txp{font-size:11.5px;fill:#0C447C;text-anchor:middle}
    .txd{font-size:11.5px;fill:#7A4A12;text-anchor:middle}
    .txe{font-size:11px;fill:#791F1F;text-anchor:middle}
    .txf{font-size:11.5px;fill:#3D3D3A;text-anchor:middle;font-weight:600}
    .lbl{font-size:11px;fill:#3D3D3A;font-weight:600}
    .edge{stroke:#73726C;stroke-width:1.5;fill:none}
    .loop{stroke:#A32D2D;stroke-width:1.25;fill:none;stroke-dasharray:4 3}
    </style>
  </defs>
  <text x="200" y="20" class="txf" style="font-size:15px">Iniciar sesión</text>
  <rect x="120" y="30" width="160" height="34" rx="16" class="start" stroke-width="1"/>
  <text x="200" y="47.0" class="tx" dominant-baseline="central">Inicio</text>
  <rect x="50" y="90" width="300" height="42" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="111.0" class="txp" dominant-baseline="central">Pulsa &#x27;Iniciar sesión con Google&#x27;</text>
  <rect x="50" y="158" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="174.5" class="txp" dominant-baseline="central">Elige tu cuenta institucional</text>
<text x="200" y="189.5" class="txp" dominant-baseline="central">@utec.edu.pe</text>
  <polygon points="200,232 358,272 200,312 42,272" class="dec" stroke-width="1"/>
  <text x="200" y="272.0" class="txd" dominant-baseline="central">¿El correo es @utec.edu.pe?</text>
  <polygon points="200,338 358,380 200,422 42,380" class="dec" stroke-width="1"/>
  <text x="200" y="373.0" class="txd" dominant-baseline="central">¿Eres alumno (nombre.apellido)</text>
<text x="200" y="387.0" class="txd" dominant-baseline="central">o ya estás registrado?</text>
  <rect x="50" y="448" width="300" height="42" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="469.0" class="txp" dominant-baseline="central">Entras al sistema (sesión activa)</text>
  <rect x="71" y="516" width="258" height="46" rx="16" class="fin" stroke-width="1"/>
  <text x="200" y="531.5" class="txf" dominant-baseline="central">Listo · la sesión se mantiene tras</text>
<text x="200" y="546.5" class="txf" dominant-baseline="central">recargar (F5)</text>
  <line x1="200" y1="64" x2="200" y2="88" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="132" x2="200" y2="156" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="206" x2="200" y2="230" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="312" x2="200" y2="336" class="edge" marker-end="url(#arrow)"/>
  <text x="208" y="329" class="lbl">Sí</text>
  <line x1="200" y1="422" x2="200" y2="446" class="edge" marker-end="url(#arrow)"/>
  <text x="208" y="439" class="lbl">Sí</text>
  <line x1="200" y1="490" x2="200" y2="514" class="edge" marker-end="url(#arrow)"/>
  <rect x="390" y="249" width="185" height="46" rx="9" class="err" stroke-width="1"/>
  <text x="482" y="264.5" class="txe" dominant-baseline="central">Usa tu correo</text>
<text x="482" y="279.5" class="txe" dominant-baseline="central">institucional UTEC</text>
  <line x1="358" y1="272" x2="388" y2="272" class="edge" marker-end="url(#arrow)"/>
  <text x="374" y="266" class="lbl" text-anchor="middle">No</text>
  <path d="M575,272 L600,272 L600,182.0 L352,182.0" class="loop" marker-end="url(#arrow)"/>
  <rect x="390" y="357" width="185" height="46" rx="9" class="err" stroke-width="1"/>
  <text x="482" y="372.5" class="txe" dominant-baseline="central">Personal nuevo: pide tu</text>
<text x="482" y="387.5" class="txe" dominant-baseline="central">alta al coordinador</text>
  <line x1="358" y1="380" x2="388" y2="380" class="edge" marker-end="url(#arrow)"/>
  <text x="374" y="374" class="lbl" text-anchor="middle">No</text>
  <text x="50" y="600" style="font-size:10px;fill:#5F5E5A">Verde=inicio · Azul=acción · Ámbar=decisión · Rojo=corrección · Gris=fin</text>
</svg>
