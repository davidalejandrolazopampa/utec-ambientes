<svg width="100%" viewBox="0 0 632 494" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Flujo: alta de persona</title>
  <desc>Guía para registrar manualmente a una persona del personal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
    text{font-family:"system-ui", -apple-system,"system-ui","Segoe UI",sans-serif}
    .start{fill:#E1F5EE;stroke:#0F6E56}
    .proc{fill:#E6F1FB;stroke:#185FA5}
    .dec{fill:#FDF1E3;stroke:#B5701E}
    .err{fill:#FCEBEB;stroke:#A32D2D}
    .fin{fill:#F1EFE8;stroke:#5F5E5A}
    .tx{font-size:11.5px;fill:#16302b;text-anchor:middle}
    .txp{font-size:11.5px;fill:#0C447C;text-anchor:middle}
    .txd{font-size:11.5px;fill:#7A4A12;text-anchor:middle}
    .txe{font-size:11px;fill:#791F1F;text-anchor:middle}
    .txf{font-size:11.5px;fill:#3D3D3A;text-anchor:middle;font-weight:600}
    .lbl{font-size:11px;fill:#3D3D3A;font-weight:600}
    .edge{stroke:#73726C;stroke-width:1.5;fill:none}
    .loop{stroke:#A32D2D;stroke-width:1.25;fill:none;stroke-dasharray:4 3}
    </style>
  </defs>
  <text x="200" y="20" class="txf" style="font-size:15px">Alta de persona (admin / coordinador)</text>
  <rect x="120" y="30" width="160" height="34" rx="16" class="start" stroke-width="1"/>
  <text x="200" y="47.0" class="tx" dominant-baseline="central">Inicio</text>
  <rect x="50" y="90" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="106.5" class="txp" dominant-baseline="central">Organización → pestaña &#x27;Personas&#x27; → &#x27;+</text>
<text x="200" y="121.5" class="txp" dominant-baseline="central">Persona&#x27;</text>
  <rect x="50" y="164" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="180.5" class="txp" dominant-baseline="central">Elige Alumno o Administrativo; correo @utec.edu.pe</text>
<text x="200" y="195.5" class="txp" dominant-baseline="central">+ nombre; carrera (alumno) o rol/cargo (admin)</text>
  <polygon points="200,238 358,278 200,318 42,278" class="dec" stroke-width="1"/>
  <text x="200" y="278.0" class="txd" dominant-baseline="central">¿Correo válido y no repetido?</text>
  <rect x="50" y="344" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="360.5" class="txp" dominant-baseline="central">Persona creada (Alumno = Estudiante;</text>
<text x="200" y="375.5" class="txp" dominant-baseline="central">luego editar o desactivar)</text>
  <rect x="120" y="418" width="160" height="34" rx="16" class="fin" stroke-width="1"/>
  <text x="200" y="435.0" class="txf" dominant-baseline="central">Listo</text>
  <line x1="200" y1="64" x2="200" y2="88" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="138" x2="200" y2="162" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="212" x2="200" y2="236" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="318" x2="200" y2="342" class="edge" marker-end="url(#arrow)"/>
  <text x="208" y="335" class="lbl">Sí</text>
  <line x1="200" y1="392" x2="200" y2="416" class="edge" marker-end="url(#arrow)"/>
  <rect x="390" y="255" width="185" height="46" rx="9" class="err" stroke-width="1"/>
  <text x="482" y="270.5" class="txe" dominant-baseline="central">Dominio externo o correo</text>
<text x="482" y="285.5" class="txe" dominant-baseline="central">duplicado: corrige</text>
  <line x1="358" y1="278" x2="388" y2="278" class="edge" marker-end="url(#arrow)"/>
  <text x="374" y="272" class="lbl" text-anchor="middle">No</text>
  <path d="M575,278 L600,278 L600,188.0 L352,188.0" class="loop" marker-end="url(#arrow)"/>
  <text x="50" y="490" style="font-size:10px;fill:#5F5E5A">Verde=inicio · Azul=acción · Ámbar=decisión · Rojo=corrección · Gris=fin</text>
</svg>
