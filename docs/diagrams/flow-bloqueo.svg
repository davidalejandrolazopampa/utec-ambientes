<svg width="100%" viewBox="0 0 632 572" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Flujo: crear un bloqueo</title>
  <desc>Guía para cerrar un laboratorio (total o parcial) o un aula/auditorio/sala (total).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
    text{font-family:"system-ui", -apple-system,"system-ui","Segoe UI",sans-serif}
    .start{fill:#E1F5EE;stroke:#0F6E56}
    .proc{fill:#E6F1FB;stroke:#185FA5}
    .dec{fill:#FDF1E3;stroke:#B5701E}
    .err{fill:#FCEBEB;stroke:#A32D2D}
    .fin{fill:#F1EFE8;stroke:#5F5E5A}
    .tx{font-size:11.5px;fill:#16302b;text-anchor:middle}
    .txp{font-size:11.5px;fill:#0C447C;text-anchor:middle}
    .txd{font-size:11.5px;fill:#7A4A12;text-anchor:middle}
    .txe{font-size:11px;fill:#791F1F;text-anchor:middle}
    .txf{font-size:11.5px;fill:#3D3D3A;text-anchor:middle;font-weight:600}
    .lbl{font-size:11px;fill:#3D3D3A;font-weight:600}
    .edge{stroke:#73726C;stroke-width:1.5;fill:none}
    .loop{stroke:#A32D2D;stroke-width:1.25;fill:none;stroke-dasharray:4 3}
    </style>
  </defs>
  <text x="200" y="20" class="txf" style="font-size:15px">Crear un bloqueo — lab o aula (responsable / admin / docencia)</text>
  <rect x="120" y="30" width="160" height="34" rx="16" class="start" stroke-width="1"/>
  <text x="200" y="47.0" class="tx" dominant-baseline="central">Inicio</text>
  <rect x="50" y="90" width="300" height="42" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="111.0" class="txp" dominant-baseline="central">Entra a &#x27;Bloqueos&#x27; y pulsa &#x27;+ Crear&#x27;</text>
  <rect x="50" y="158" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="174.5" class="txp" dominant-baseline="central">Elige el tipo de ambiente (lab o aula) y</text>
<text x="200" y="189.5" class="txp" dominant-baseline="central">completa título, responsable, motivo, fecha, franja</text>
  <rect x="50" y="232" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="248.5" class="txp" dominant-baseline="central">Lab: TOTAL (todo) o PARCIAL (recursos);</text>
<text x="200" y="263.5" class="txp" dominant-baseline="central">aula/auditorio/sala: siempre TOTAL</text>
  <polygon points="200,306 358,348 200,390 42,348" class="dec" stroke-width="1"/>
  <text x="200" y="341.0" class="txd" dominant-baseline="central">¿Franja 07:00–23:00 y sin</text>
<text x="200" y="355.0" class="txd" dominant-baseline="central">reservas/bloqueos en conflicto?</text>
  <rect x="50" y="416" width="300" height="42" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="437.0" class="txp" dominant-baseline="central">Bloqueo creado + correo al responsable</text>
  <rect x="54" y="484" width="291" height="46" rx="16" class="fin" stroke-width="1"/>
  <text x="200" y="499.5" class="txf" dominant-baseline="central">Listo · un motivo operativo no</text>
<text x="200" y="514.5" class="txf" dominant-baseline="central">cuenta en el dashboard</text>
  <line x1="200" y1="64" x2="200" y2="88" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="132" x2="200" y2="156" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="206" x2="200" y2="230" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="280" x2="200" y2="304" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="390" x2="200" y2="414" class="edge" marker-end="url(#arrow)"/>
  <text x="208" y="407" class="lbl">Sí</text>
  <line x1="200" y1="458" x2="200" y2="482" class="edge" marker-end="url(#arrow)"/>
  <rect x="390" y="318" width="185" height="61" rx="9" class="err" stroke-width="1"/>
  <text x="482" y="333.0" class="txe" dominant-baseline="central">Ajusta la franja o</text>
<text x="482" y="348.0" class="txe" dominant-baseline="central">resuelve los choques</text>
<text x="482" y="363.0" class="txe" dominant-baseline="central">(OUT_OF_WINDOW)</text>
  <line x1="358" y1="348" x2="388" y2="348" class="edge" marker-end="url(#arrow)"/>
  <text x="374" y="342" class="lbl" text-anchor="middle">No</text>
  <path d="M575,348 L600,348 L600,182.0 L352,182.0" class="loop" marker-end="url(#arrow)"/>
  <text x="50" y="568" style="font-size:10px;fill:#5F5E5A">Verde=inicio · Azul=acción · Ámbar=decisión · Rojo=corrección · Gris=fin</text>
</svg>
