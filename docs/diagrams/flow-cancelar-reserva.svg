<svg width="100%" viewBox="0 0 632 512" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Flujo: cancelar, modificar o reactivar una reserva</title>
  <desc>Guía para cancelar o cambiar una reserva, con confirmación previa, y para revertir una cancelación el mismo día.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
    text{font-family:"system-ui", -apple-system,"system-ui","Segoe UI",sans-serif}
    .start{fill:#E1F5EE;stroke:#0F6E56}
    .proc{fill:#E6F1FB;stroke:#185FA5}
    .dec{fill:#FDF1E3;stroke:#B5701E}
    .err{fill:#FCEBEB;stroke:#A32D2D}
    .fin{fill:#F1EFE8;stroke:#5F5E5A}
    .tx{font-size:11.5px;fill:#16302b;text-anchor:middle}
    .txp{font-size:11.5px;fill:#0C447C;text-anchor:middle}
    .txd{font-size:11.5px;fill:#7A4A12;text-anchor:middle}
    .txe{font-size:11px;fill:#791F1F;text-anchor:middle}
    .txf{font-size:11.5px;fill:#3D3D3A;text-anchor:middle;font-weight:600}
    .lbl{font-size:11px;fill:#3D3D3A;font-weight:600}
    .edge{stroke:#73726C;stroke-width:1.5;fill:none}
    .loop{stroke:#A32D2D;stroke-width:1.25;fill:none;stroke-dasharray:4 3}
    </style>
  </defs>
  <text x="200" y="20" class="txf" style="font-size:15px">Cancelar, modificar o reactivar una reserva</text>

  <rect x="120" y="30" width="160" height="34" rx="16" class="start" stroke-width="1"/>
  <text x="200" y="47.0" class="tx" dominant-baseline="central">Inicio</text>

  <rect x="50" y="88" width="300" height="44" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="102.5" class="txp" dominant-baseline="central">Abre &#x27;Mis Reservas&#x27; y elige la reserva</text>
  <text x="200" y="117.5" class="txp" dominant-baseline="central">(Hoy / Próximas / Pasadas)</text>

  <rect x="50" y="150" width="300" height="44" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="164.5" class="txp" dominant-baseline="central">Pulsa &#x27;Cancelar&#x27;, &#x27;Modificar&#x27;, o</text>
  <text x="200" y="179.5" class="txp" dominant-baseline="central">&#x27;↩ Reactivar&#x27; (cancelada de HOY)</text>

  <rect x="50" y="212" width="300" height="44" rx="9" class="dec" stroke-width="1"/>
  <text x="200" y="226.5" class="txd" dominant-baseline="central">Aparece el modal &#x27;¿Confirmar?&#x27;</text>
  <text x="200" y="241.5" class="txd" dominant-baseline="central">→ Aceptar (Cancelar = no hace nada)</text>

  <polygon points="200,262 360,300 200,338 40,300" class="dec" stroke-width="1"/>
  <text x="200" y="293.0" class="txd" dominant-baseline="central">¿Permitido? (dueño/rol elevado;</text>
  <text x="200" y="307.0" class="txd" dominant-baseline="central">reactivar: solo el mismo día)</text>

  <rect x="50" y="362" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="378.5" class="txp" dominant-baseline="central">Se aplica: cancela / guarda, o</text>
  <text x="200" y="393.5" class="txp" dominant-baseline="central">reactiva → estado CONFIRMADA</text>

  <rect x="120" y="438" width="160" height="34" rx="16" class="fin" stroke-width="1"/>
  <text x="200" y="455.0" class="txf" dominant-baseline="central">Listo</text>

  <rect x="390" y="277" width="205" height="46" rx="9" class="err" stroke-width="1"/>
  <text x="492" y="292.5" class="txe" dominant-baseline="central">No: reserva ajena (403),</text>
  <text x="492" y="307.5" class="txe" dominant-baseline="central">día pasado (EXPIRED) o franja ocupada</text>

  <line x1="200" y1="64" x2="200" y2="86" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="132" x2="200" y2="148" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="194" x2="200" y2="210" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="256" x2="200" y2="261" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="338" x2="200" y2="360" class="edge" marker-end="url(#arrow)"/>
  <text x="208" y="353" class="lbl">Sí</text>
  <line x1="200" y1="410" x2="200" y2="436" class="edge" marker-end="url(#arrow)"/>
  <line x1="360" y1="300" x2="388" y2="300" class="edge" marker-end="url(#arrow)"/>
  <text x="374" y="294" class="lbl" text-anchor="middle">No</text>

  <text x="50" y="506" style="font-size:10px;fill:#5F5E5A">Verde=inicio · Azul=acción · Ámbar=decisión/confirmación · Rojo=corrección · Gris=fin</text>
</svg>
