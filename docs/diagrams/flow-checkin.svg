<svg width="100%" viewBox="0 0 632 688" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Flujo: hacer check-in</title>
  <desc>Guía para validar la asistencia mediante el QR del recurso.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
    text{font-family:"system-ui", -apple-system,"system-ui","Segoe UI",sans-serif}
    .start{fill:#E1F5EE;stroke:#0F6E56}
    .proc{fill:#E6F1FB;stroke:#185FA5}
    .dec{fill:#FDF1E3;stroke:#B5701E}
    .err{fill:#FCEBEB;stroke:#A32D2D}
    .fin{fill:#F1EFE8;stroke:#5F5E5A}
    .tx{font-size:11.5px;fill:#16302b;text-anchor:middle}
    .txp{font-size:11.5px;fill:#0C447C;text-anchor:middle}
    .txd{font-size:11.5px;fill:#7A4A12;text-anchor:middle}
    .txe{font-size:11px;fill:#791F1F;text-anchor:middle}
    .txf{font-size:11.5px;fill:#3D3D3A;text-anchor:middle;font-weight:600}
    .lbl{font-size:11px;fill:#3D3D3A;font-weight:600}
    .edge{stroke:#73726C;stroke-width:1.5;fill:none}
    .loop{stroke:#A32D2D;stroke-width:1.25;fill:none;stroke-dasharray:4 3}
    </style>
  </defs>
  <text x="200" y="20" class="txf" style="font-size:15px">Hacer check-in (QR)</text>
  <rect x="71" y="30" width="258" height="34" rx="16" class="start" stroke-width="1"/>
  <text x="200" y="47.0" class="tx" dominant-baseline="central">Inicio (tienes una reserva de hoy)</text>
  <rect x="50" y="90" width="300" height="42" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="111.0" class="txp" dominant-baseline="central">Ve a &#x27;Mis Reservas&#x27; o a &#x27;Check-in&#x27;</text>
  <polygon points="200,158 358,200 200,242 42,200" class="dec" stroke-width="1"/>
  <text x="200" y="193.0" class="txd" dominant-baseline="central">¿Es hoy y faltan ≤10 min para</text>
<text x="200" y="207.0" class="txd" dominant-baseline="central">tu hora?</text>
  <rect x="50" y="268" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="284.5" class="txp" dominant-baseline="central">Abre &#x27;Check-in&#x27; y apunta la cámara al QR</text>
<text x="200" y="299.5" class="txp" dominant-baseline="central">del recurso</text>
  <polygon points="200,342 358,384 200,426 42,384" class="dec" stroke-width="1"/>
  <text x="200" y="377.0" class="txd" dominant-baseline="central">¿QR del recurso correcto y</text>
<text x="200" y="391.0" class="txd" dominant-baseline="central">reserva válida?</text>
  <rect x="50" y="452" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="468.5" class="txp" dominant-baseline="central">Check-in confirmado: tu reserva pasa a</text>
<text x="200" y="483.5" class="txp" dominant-baseline="central">EN_CURSO (recibes un correo de confirmación)</text>
  <rect x="50" y="526" width="300" height="48" rx="9" class="proc" stroke-width="1"/>
  <text x="200" y="542.5" class="txp" dominant-baseline="central">¿No puedes escanear? El responsable hace</text>
<text x="200" y="557.5" class="txp" dominant-baseline="central">check-in manual</text>
  <rect x="54" y="600" width="291" height="46" rx="16" class="fin" stroke-width="1"/>
  <text x="200" y="615.5" class="txf" dominant-baseline="central">Usa el laboratorio · sin check-in en 15</text>
<text x="200" y="630.5" class="txf" dominant-baseline="central">min se cancela</text>
  <line x1="200" y1="64" x2="200" y2="88" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="132" x2="200" y2="156" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="242" x2="200" y2="266" class="edge" marker-end="url(#arrow)"/>
  <text x="208" y="259" class="lbl">Sí</text>
  <line x1="200" y1="316" x2="200" y2="340" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="426" x2="200" y2="450" class="edge" marker-end="url(#arrow)"/>
  <text x="208" y="443" class="lbl">Sí</text>
  <line x1="200" y1="500" x2="200" y2="524" class="edge" marker-end="url(#arrow)"/>
  <line x1="200" y1="574" x2="200" y2="598" class="edge" marker-end="url(#arrow)"/>
  <rect x="390" y="177" width="185" height="46" rx="9" class="err" stroke-width="1"/>
  <text x="482" y="192.5" class="txe" dominant-baseline="central">Espera: el check-in se</text>
<text x="482" y="207.5" class="txe" dominant-baseline="central">habilita 10 min antes</text>
  <line x1="358" y1="200" x2="388" y2="200" class="edge" marker-end="url(#arrow)"/>
  <text x="374" y="194" class="lbl" text-anchor="middle">No</text>
  <path d="M575,200 L600,200 L600,111.0 L352,111.0" class="loop" marker-end="url(#arrow)"/>
  <rect x="390" y="361" width="185" height="46" rx="9" class="err" stroke-width="1"/>
  <text x="482" y="376.5" class="txe" dominant-baseline="central">QR equivocado o reserva no</text>
<text x="482" y="391.5" class="txe" dominant-baseline="central">válida: revisa el recurso</text>
  <line x1="358" y1="384" x2="388" y2="384" class="edge" marker-end="url(#arrow)"/>
  <text x="374" y="378" class="lbl" text-anchor="middle">No</text>
  <path d="M575,384 L600,384 L600,292.0 L352,292.0" class="loop" marker-end="url(#arrow)"/>
  <text x="50" y="684" style="font-size:10px;fill:#5F5E5A">Verde=inicio · Azul=acción · Ámbar=decisión · Rojo=corrección · Gris=fin</text>
</svg>
