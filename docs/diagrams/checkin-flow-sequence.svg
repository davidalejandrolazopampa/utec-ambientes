<svg width="100%" viewBox="0 0 720 470" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Flujo de check-in por QR</title>
  <desc>Secuencia: el alumno escanea el QR del recurso; el backend valida pertenencia, fecha de hoy, ventana de 10 minutos y estado, y marca la reserva EN_CURSO.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:"system-ui", -apple-system,"system-ui","Segoe UI",sans-serif}
      .ll-blue{fill:#E6F1FB;stroke:#185FA5}.ll-green{fill:#E1F5EE;stroke:#0F6E56}.ll-purple{fill:#EEEDFE;stroke:#534AB7}
      .tx-blue{fill:#0C447C}.tx-green{fill:#085041}.tx-purple{fill:#3C3489}
      .lname{font-size:13px;font-weight:600;text-anchor:middle}
      .life{stroke:#3D3D3A;stroke-width:0.5;stroke-dasharray:4 3}
      .msg{stroke-width:1;fill:none}
      .m-blue{stroke:#185FA5}.m-green{stroke:#0F6E56}.m-purple{stroke:#534AB7}
      .ret{stroke-dasharray:4 3}
      .lbl{font-size:11px;fill:#3D3D3A;text-anchor:middle}
      .note{fill:#F1EFE8;stroke:#9C9A92;stroke-width:0.75}
      .ntext{font-size:10.5px;fill:#5F5E5A}
    </style>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="lname" style="font-size:15px;fill:#3D3D3A">Check-in por QR — ventana de 10 minutos</text>

  <rect x="40"  y="36" width="100" height="34" rx="6" class="ll-blue"   stroke-width="0.5"/><text x="90"  y="57" class="lname tx-blue">Alumno</text>
  <rect x="200" y="36" width="130" height="34" rx="6" class="ll-green"  stroke-width="0.5"/><text x="265" y="57" class="lname tx-green">Frontend @zxing</text>
  <rect x="375" y="36" width="160" height="34" rx="6" class="ll-purple" stroke-width="0.5"/><text x="455" y="57" class="lname tx-purple">QrCheckinService</text>
  <rect x="585" y="36" width="110" height="34" rx="6" class="ll-blue"   stroke-width="0.5"/><text x="640" y="57" class="lname tx-blue">PostgreSQL</text>

  <line x1="90"  y1="70" x2="90"  y2="430" class="life"/>
  <line x1="265" y1="70" x2="265" y2="430" class="life"/>
  <line x1="455" y1="70" x2="455" y2="430" class="life"/>
  <line x1="640" y1="70" x2="640" y2="430" class="life"/>

  <text x="178" y="98" class="lbl">1. Escanea el QR del recurso</text>
  <line x1="90" y1="106" x2="260" y2="106" class="msg m-blue" marker-end="url(#arrow)"/>

  <text x="360" y="128" class="lbl">2. POST /checkin/qr/{qrCode} (Bearer)</text>
  <line x1="265" y1="136" x2="450" y2="136" class="msg m-green" marker-end="url(#arrow)"/>

  <text x="547" y="158" class="lbl">3. localizar recurso + reserva de hoy</text>
  <line x1="455" y1="166" x2="635" y2="166" class="msg m-purple" marker-end="url(#arrow)"/>
  <line x1="640" y1="190" x2="460" y2="190" class="msg m-blue ret" marker-end="url(#arrow)"/>

  <rect x="455" y="200" width="240" height="58" rx="6" class="note"/>
  <text x="465" y="216" class="ntext">4. Valida: pertenencia · fecha de hoy ·</text>
  <text x="465" y="231" class="ntext">ventana (desde 10 min antes) ·</text>
  <text x="465" y="246" class="ntext">estado PENDIENTE</text>
  <line x1="455" y1="258" x2="455" y2="200" class="msg m-purple"/>

  <text x="547" y="272" class="lbl">5. reserva → EN_CURSO · recurso → OCUPADO</text>
  <line x1="455" y1="280" x2="635" y2="280" class="msg m-purple" marker-end="url(#arrow)"/>
  <text x="547" y="302" class="lbl">6. INSERT qr_validaciones (VALIDO)</text>
  <line x1="455" y1="310" x2="635" y2="310" class="msg m-purple" marker-end="url(#arrow)"/>
  <line x1="640" y1="334" x2="460" y2="334" class="msg m-blue ret" marker-end="url(#arrow)"/>

  <text x="360" y="356" class="lbl">7. 200 OK · CheckinResponse</text>
  <line x1="455" y1="364" x2="270" y2="364" class="msg m-purple ret" marker-end="url(#arrow)"/>
  <text x="178" y="386" class="lbl">8. ✅ Check-in confirmado (+ correo al titular)</text>
  <line x1="265" y1="394" x2="95" y2="394" class="msg m-green ret" marker-end="url(#arrow)"/>

  <rect x="40" y="406" width="640" height="22" rx="6" class="note" style="fill:#FCEBEB;stroke:#A32D2D"/>
  <text x="52" y="421" class="ntext" style="fill:#791F1F">Si está fuera de la ventana → "se habilita 10 minutos antes" · QR de otro recurso/fecha → inválido (4xx).</text>
</svg>
