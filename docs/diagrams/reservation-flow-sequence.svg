<svg width="100%" viewBox="0 0 720 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Flujo de creación de reserva con control de concurrencia</title>
  <desc>Secuencia: el alumno crea una reserva; el backend valida reglas, bloquea el recurso (SELECT FOR UPDATE + version), inserta la reserva y dispara el correo asíncrono.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:"system-ui", -apple-system,"system-ui","Segoe UI",sans-serif}
      .ll-blue{fill:#E6F1FB;stroke:#185FA5}
      .ll-green{fill:#E1F5EE;stroke:#0F6E56}
      .ll-purple{fill:#EEEDFE;stroke:#534AB7}
      .ll-amber{fill:#FDF1E3;stroke:#B5701E}
      .tx-blue{fill:#0C447C}.tx-green{fill:#085041}.tx-purple{fill:#3C3489}.tx-amber{fill:#7A4A12}
      .lname{font-size:13px;font-weight:600;text-anchor:middle}
      .life{stroke:#3D3D3A;stroke-width:0.5;stroke-dasharray:4 3}
      .msg{stroke-width:1;fill:none}
      .m-blue{stroke:#185FA5}.m-green{stroke:#0F6E56}.m-purple{stroke:#534AB7}.m-amber{stroke:#B5701E}
      .ret{stroke-dasharray:4 3}
      .lbl{font-size:11px;fill:#3D3D3A;text-anchor:middle}
      .note{fill:#F1EFE8;stroke:#9C9A92;stroke-width:0.75}
      .ntext{font-size:10.5px;fill:#5F5E5A}
    </style>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="lname" style="font-size:15px;fill:#3D3D3A">Creación de reserva — control de concurrencia</text>

  <!-- Lifeline heads -->
  <rect x="25"  y="36" width="90"  height="34" rx="6" class="ll-blue"   stroke-width="0.5"/><text x="70"  y="57" class="lname tx-blue">Alumno</text>
  <rect x="160" y="36" width="100" height="34" rx="6" class="ll-green"  stroke-width="0.5"/><text x="210" y="57" class="lname tx-green">Frontend</text>
  <rect x="315" y="36" width="100" height="34" rx="6" class="ll-purple" stroke-width="0.5"/><text x="365" y="57" class="lname tx-purple">Backend</text>
  <rect x="465" y="36" width="110" height="34" rx="6" class="ll-blue"   stroke-width="0.5"/><text x="520" y="57" class="lname tx-blue">PostgreSQL</text>
  <rect x="595" y="36" width="120" height="34" rx="6" class="ll-amber"  stroke-width="0.5"/><text x="655" y="57" class="lname tx-amber">RabbitMQ/Mail</text>

  <!-- Lifelines -->
  <line x1="70"  y1="70" x2="70"  y2="560" class="life"/>
  <line x1="210" y1="70" x2="210" y2="560" class="life"/>
  <line x1="365" y1="70" x2="365" y2="560" class="life"/>
  <line x1="520" y1="70" x2="520" y2="560" class="life"/>
  <line x1="655" y1="70" x2="655" y2="560" class="life"/>

  <!-- 1 -->
  <text x="140" y="98" class="lbl">1. Completa formulario de reserva</text>
  <line x1="70" y1="106" x2="205" y2="106" class="msg m-blue" marker-end="url(#arrow)"/>
  <!-- 2 -->
  <text x="288" y="128" class="lbl">2. POST /reservas (Bearer + participantesEmails)</text>
  <line x1="210" y1="136" x2="360" y2="136" class="msg m-green" marker-end="url(#arrow)"/>
  <!-- 3 self validar -->
  <rect x="365" y="150" width="295" height="42" rx="6" class="note"/>
  <text x="375" y="165" class="ntext">3. Valida: fecha · día · horario · aforo</text>
  <text x="375" y="180" class="ntext">+ resolver acompañantes por correo (registrados)</text>
  <line x1="365" y1="192" x2="365" y2="150" class="msg m-purple"/>
  <!-- 4 -->
  <text x="442" y="202" class="lbl">4. SELECT recurso FOR UPDATE</text>
  <line x1="365" y1="210" x2="515" y2="210" class="msg m-purple" marker-end="url(#arrow)"/>
  <!-- 5 -->
  <text x="442" y="232" class="lbl">5. ¿choque con reservas/bloqueos?</text>
  <line x1="365" y1="240" x2="515" y2="240" class="msg m-purple" marker-end="url(#arrow)"/>
  <!-- 6 return -->
  <text x="442" y="262" class="lbl">sin conflicto</text>
  <line x1="520" y1="270" x2="370" y2="270" class="msg m-blue ret" marker-end="url(#arrow)"/>
  <!-- 7 insert -->
  <text x="442" y="292" class="lbl">6. INSERT reserva PENDIENTE + reserva_participantes (con carrera)</text>
  <line x1="365" y1="300" x2="515" y2="300" class="msg m-purple" marker-end="url(#arrow)"/>
  <line x1="520" y1="324" x2="370" y2="324" class="msg m-blue ret" marker-end="url(#arrow)"/>
  <!-- 7b publish to MQ -->
  <text x="510" y="350" class="lbl">7. publica evento correo</text>
  <line x1="365" y1="358" x2="650" y2="358" class="msg m-purple" marker-end="url(#arrow)"/>
  <!-- 8 async send note -->
  <rect x="455" y="372" width="200" height="30" rx="6" class="note"/>
  <text x="465" y="391" class="ntext">8. enviarReservaConfirmada @Async</text>
  <line x1="655" y1="402" x2="655" y2="372" class="msg m-amber"/>
  <!-- 9 email back to alumno -->
  <text x="360" y="424" class="lbl">9. Correo "recuerda tu check-in"</text>
  <line x1="655" y1="432" x2="75" y2="432" class="msg m-amber ret" marker-end="url(#arrow)"/>
  <!-- 10 200 OK to frontend -->
  <text x="288" y="456" class="lbl">10. 200 OK · ReservaResponse</text>
  <line x1="365" y1="464" x2="215" y2="464" class="msg m-purple ret" marker-end="url(#arrow)"/>
  <!-- 11 UI -->
  <text x="140" y="486" class="lbl">11. Confirmación en pantalla</text>
  <line x1="210" y1="494" x2="75" y2="494" class="msg m-green ret" marker-end="url(#arrow)"/>

  <!-- alt note -->
  <rect x="40" y="508" width="640" height="54" rx="8" class="note" style="fill:#FCEBEB;stroke:#A32D2D"/>
  <text x="52" y="523" class="ntext" style="fill:#791F1F;font-weight:600">Camino de error (alt): validación/conflicto → BusinessException → 4xx + code:</text>
  <text x="52" y="538" class="ntext" style="fill:#791F1F">INVALID_DATE · DATE_TOO_FAR · LAB_CLOSED_DAY · EXCEEDS_CAPACITY ·</text>
  <text x="52" y="553" class="ntext" style="fill:#791F1F">PARTICIPANT_NOT_FOUND · doble-booking (RESOURCE_NOT_AVAILABLE)</text>
</svg>
