<svg width="100%" viewBox="0 0 720 880" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Arquitectura del Sistema UTEC Lab Reservation</title>
  <desc>Monolito modular: Frontend React, Nginx, capa de seguridad OAuth2+JWT, backend Spring Boot, módulos de dominio, datos (PostgreSQL/Redis/RabbitMQ) y servicios externos (Google, Gmail).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:"system-ui", -apple-system,"system-ui","Segoe UI",sans-serif}
      .layer{stroke-width:1;rx:12}
      .l-blue{fill:#E6F1FB;stroke:#185FA5}
      .l-green{fill:#E1F5EE;stroke:#0F6E56}
      .l-purple{fill:#EEEDFE;stroke:#534AB7}
      .l-red{fill:#FCEBEB;stroke:#A32D2D}
      .l-amber{fill:#FDF1E3;stroke:#B5701E}
      .l-neutral{fill:#F1EFE8;stroke:#5F5E5A}
      .chip{fill:#FFFFFF;stroke:#9C9A92;stroke-width:0.75}
      .t-title{font-size:14px;font-weight:600}
      .t-sub{font-size:11px}
      .t-chip{font-size:11px}
      .t-edge{font-size:11px;fill:#3D3D3A}
      .tx-blue{fill:#0C447C}.tx-green{fill:#085041}.tx-purple{fill:#3C3489}.tx-red{fill:#791F1F}.tx-amber{fill:#7A4A12}.tx-neutral{fill:#5F5E5A}
      .edge{stroke:#73726C;stroke-width:1.5;fill:none}
    </style>
  </defs>

  <text x="360" y="26" text-anchor="middle" class="t-title" style="font-size:16px;fill:#3D3D3A">Arquitectura — UTEC Lab Reservation</text>

  <!-- Frontend -->
  <rect x="40" y="44" width="640" height="60" rx="12" class="l-blue" stroke-width="1"/>
  <text x="360" y="68" text-anchor="middle" class="t-title tx-blue">Frontend — React 18 + TypeScript + Vite (:5173)</text>
  <text x="360" y="88" text-anchor="middle" class="t-sub tx-blue">TailwindCSS · Zustand · TanStack Query · React Router · @zxing (QR) · react-big-calendar</text>

  <line x1="360" y1="104" x2="360" y2="134" class="edge" marker-end="url(#arrow)"/>
  <text x="372" y="123" class="t-edge">HTTPS · JWT Bearer (memoria) + cookie refresh HttpOnly</text>

  <!-- Nginx -->
  <rect x="230" y="134" width="260" height="40" rx="8" class="l-neutral" stroke-width="1"/>
  <text x="360" y="154" text-anchor="middle" class="t-title tx-neutral">Nginx — Reverse Proxy + cabeceras</text>
  <text x="360" y="168" text-anchor="middle" class="t-sub tx-neutral">HSTS · CSP · X-Frame-Options · nosniff</text>

  <line x1="360" y1="174" x2="360" y2="204" class="edge" marker-end="url(#arrow)"/>

  <!-- Security -->
  <rect x="40" y="204" width="640" height="58" rx="10" class="l-red" stroke-width="1"/>
  <text x="360" y="226" text-anchor="middle" class="t-title tx-red">Capa de seguridad — Spring Security</text>
  <text x="360" y="246" text-anchor="middle" class="t-sub tx-red">OAuth2 Google SSO · JWT (JwtAuthenticationFilter) · RBAC (@PreAuthorize + rutas) · CORS · pertenencia/propiedad (anti-IDOR)</text>

  <line x1="360" y1="262" x2="360" y2="292" class="edge" marker-end="url(#arrow)"/>

  <!-- Backend API -->
  <rect x="40" y="292" width="640" height="58" rx="10" class="l-green" stroke-width="1"/>
  <text x="360" y="314" text-anchor="middle" class="t-title tx-green">Backend — Spring Boot 3 + Java 21 (:8080)</text>
  <text x="360" y="334" text-anchor="middle" class="t-sub tx-green">REST /api/v1 · OpenAPI/Swagger · Actuator · capas controller → service → repository (DTOs)</text>

  <line x1="360" y1="350" x2="360" y2="380" class="edge" marker-end="url(#arrow)"/>

  <!-- Domain modules -->
  <rect x="40" y="380" width="640" height="158" rx="14" class="l-purple" stroke-width="1"/>
  <text x="360" y="402" text-anchor="middle" class="t-title tx-purple">Módulos de dominio (monolito modular) · pe.edu.utec.reservas.modules</text>
  <!-- chips row 1 -->
  <g class="t-chip tx-neutral" text-anchor="middle">
    <rect x="58"  y="418" width="92" height="30" rx="6" class="chip"/><text x="104" y="437">auth</text>
    <rect x="158" y="418" width="92" height="30" rx="6" class="chip"/><text x="204" y="437">iam / roles</text>
    <rect x="258" y="418" width="92" height="30" rx="6" class="chip"/><text x="304" y="437">laboratorios</text>
    <rect x="358" y="418" width="92" height="30" rx="6" class="chip"/><text x="404" y="437">reservas</text>
    <rect x="458" y="418" width="92" height="30" rx="6" class="chip"/><text x="504" y="437">bloqueos</text>
    <rect x="558" y="418" width="104" height="30" rx="6" class="chip"/><text x="610" y="437">qr / check-in</text>
  </g>
  <!-- chips row 2 -->
  <g class="t-chip tx-neutral" text-anchor="middle">
    <rect x="58"  y="456" width="92" height="30" rx="6" class="chip"/><text x="104" y="475">analytics</text>
    <rect x="158" y="456" width="92" height="30" rx="6" class="chip"/><text x="204" y="475">audit</text>
    <rect x="258" y="456" width="92" height="30" rx="6" class="chip"/><text x="304" y="475">notificaciones</text>
    <rect x="358" y="456" width="92" height="30" rx="6" class="chip"/><text x="404" y="475">respaldo</text>
    <rect x="458" y="456" width="92" height="30" rx="6" class="chip"/><text x="504" y="475">aulas / horario</text>
    <rect x="558" y="456" width="104" height="30" rx="6" class="chip"/><text x="610" y="475">realtime (SSE)</text>
  </g>
  <text x="360" y="510" text-anchor="middle" class="t-sub tx-purple">Reglas: auto-cascada responsable→director→departamento · ventanas horarias · medianoche · schedulers (ShedLock)</text>

  <line x1="360" y1="538" x2="360" y2="568" class="edge" marker-end="url(#arrow)"/>
  <text x="372" y="557" class="t-edge">JPA / Hibernate · Flyway</text>

  <!-- Data layer -->
  <rect x="56" y="568" width="192" height="70" rx="12" class="l-blue" stroke-width="1"/>
  <text x="152" y="596" text-anchor="middle" class="t-title tx-blue">🐘 PostgreSQL 16</text>
  <text x="152" y="616" text-anchor="middle" class="t-sub tx-blue">23 tablas · 8 ENUMs · :5432</text>

  <rect x="264" y="568" width="192" height="70" rx="12" class="l-red" stroke-width="1"/>
  <text x="360" y="596" text-anchor="middle" class="t-title tx-red">⚡ Redis 7</text>
  <text x="360" y="616" text-anchor="middle" class="t-sub tx-red">caché de aplicación</text>

  <rect x="472" y="568" width="192" height="70" rx="12" class="l-amber" stroke-width="1"/>
  <text x="568" y="596" text-anchor="middle" class="t-title tx-amber">🐰 RabbitMQ 3.13</text>
  <text x="568" y="616" text-anchor="middle" class="t-sub tx-amber">correos async · vhost utec</text>

  <line x1="152" y1="568" x2="152" y2="550" class="edge" marker-end="url(#arrow)"/>
  <line x1="360" y1="568" x2="360" y2="550" class="edge" marker-end="url(#arrow)"/>
  <line x1="568" y1="568" x2="568" y2="550" class="edge" marker-end="url(#arrow)"/>

  <!-- External services -->
  <text x="360" y="678" text-anchor="middle" class="t-sub tx-neutral" style="font-weight:600">Servicios externos</text>
  <rect x="150" y="690" width="180" height="56" rx="10" class="l-blue" stroke-width="1"/>
  <text x="240" y="714" text-anchor="middle" class="t-title tx-blue">🔐 Google OAuth2</text>
  <text x="240" y="732" text-anchor="middle" class="t-sub tx-blue">identidad @utec.edu.pe</text>

  <rect x="390" y="690" width="180" height="56" rx="10" class="l-amber" stroke-width="1"/>
  <text x="480" y="714" text-anchor="middle" class="t-title tx-amber">✉️ Gmail SMTP</text>
  <text x="480" y="732" text-anchor="middle" class="t-sub tx-amber">conceptlab@utec.edu.pe</text>

  <!-- external links -->
  <path d="M150 718 C 90 718, 90 233, 40 233" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="60" y="470" class="t-edge" transform="rotate(-90 60 470)">verifica id_token</text>
  <path d="M570 718 C 690 718, 690 603, 664 603" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="700" y="660" class="t-edge" transform="rotate(-90 700 660)">envía correos</text>

  <!-- footer legend -->
  <text x="40" y="800" class="t-sub tx-neutral">Despliegue: docker-compose (5 servicios), imágenes multi-stage, no-new-privileges, infra atada a 127.0.0.1.</text>
  <text x="40" y="820" class="t-sub tx-neutral">Escalado: ShedLock permite múltiples instancias del backend (cada @Scheduled corre una sola vez).</text>
  <text x="40" y="840" class="t-sub tx-neutral">Auth: access token en memoria (frontend) · refresh token en cookie HttpOnly+Secure+SameSite=Strict.</text>
</svg>
